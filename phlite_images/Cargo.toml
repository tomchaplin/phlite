[package]
name = "phlite_images"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology of images (cubical complexes) with phlite, and the phlite.images Python package"
repository.workspace = true
homepage = "https://phlite.tomchaplin.xyz"
documentation = "https://docs.rs/phlite_images"
readme = "README.md"
keywords = ["topology", "persistence", "homology", "cubical", "image"]
categories = ["mathematics", "science"]

[lib]
# cdylib for the `phlite.images` extension module (feature `python`), rlib for Rust users
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phlite_images_stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["python"]

[dependencies]
ordered-float = "5.5.1"
rayon = "1.12.0"
phlite = { workspace = true, features = ["parallel"] }
pyo3 = { version = "0.30.1", optional = true }
numpy = { version = "0.30.0", optional = true }
pyo3-log = { version = "0.13.5", optional = true }
pyo3-stub-gen = { version = "0.23.2", optional = true }
phlite_bindings = { workspace = true, optional = true }

[features]
# Also build the lock-free backend of the parallel reduction
lock-free = ["phlite/lock-free"]
# The `phlite.images` Python extension module, built with maturin as `phlite-images` (see pyproject.toml)
python = ["dep:pyo3", "dep:pyo3-log", "dep:pyo3-stub-gen", "dep:numpy", "dep:phlite_bindings", "lock-free"]
