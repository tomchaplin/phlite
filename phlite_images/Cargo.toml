[package]
name = "phlite_images"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology of images (cubical complexes) with phlite, and the phlite.images Python package"

[lib]
# cdylib for the `phlite.images` extension module (feature `python`), rlib for Rust users
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phlite_images_stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["python"]

[dependencies]
ordered-float = "5.5.1"
phlite = { version = "0.1.0", path = "../phlite", features = ["parallel"] }
pyo3 = { version = "0.30.1", optional = true }
pyo3-log = { version = "0.13.5", optional = true }
pyo3-stub-gen = { version = "0.23.2", optional = true }
phlite_bindings = { path = "../phlite_bindings", optional = true }

[features]
# Also build the lock-free backend of the parallel reduction
lock-free = ["phlite/lock-free"]
# The `phlite.images` Python extension module, built with maturin as `phlite-images` (see pyproject.toml)
python = ["dep:pyo3", "dep:pyo3-log", "dep:pyo3-stub-gen", "dep:phlite_bindings", "lock-free"]
