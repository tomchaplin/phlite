[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "phlite-images"
readme = "README.md"
description = "Persistent homology of images (cubical complexes), computed with phlite"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Every phlite package is released on the same version (phlite_bindings' tests check this pin)
dependencies = ["phlite-core==0.3.0", "numpy"]
dynamic = ["version"]

[project.urls]
Homepage = "https://phlite.tomchaplin.xyz"
Documentation = "https://phlite.tomchaplin.xyz/book/"
Repository = "https://github.com/tomchaplin/phlite"

[tool.maturin]
features = ["python", "pyo3/extension-module"]
# `phlite` is a namespace package shared by every phlite package, so python/phlite has no __init__.py: only this
# package's own module, phlite/images, which re-exports the extension module `phlite.images._images`
python-source = "python"
module-name = "phlite.images._images"
# Bytecode left by local runs (from python-source) doesn't belong in the wheel
exclude = ["**/__pycache__/**"]
