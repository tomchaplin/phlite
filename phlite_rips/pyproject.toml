[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "phlite_rips"
description = "Vietoris-Rips persistent homology, computed with phlite"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
features = ["python", "pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.9,<2.0",
    "numpy",
]

[tool.uv]
# The extension module is built by `maturin develop` (see justfile), not by `uv sync`
package = false
