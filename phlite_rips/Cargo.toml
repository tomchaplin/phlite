[package]
name = "phlite_rips"
version = "0.1.0"
edition = "2021"

[lib]
name = "phlite_rips"
path = "src/lib.rs"

[[bin]]
name = "phlite_rips_cli"
path = "src/main.rs"

[dependencies]
csv = "1.4.0"
ordered-float = "5.5.1"
phlite = { version = "0.1.0", path = "../phlite", features = ["parallel"] }

[features]
# Also build the lock-free backend of the parallel reduction (tests and benchmarks use it when enabled)
lock-free = ["phlite/lock-free"]

[dev-dependencies]
rayon = "1.12.0"
