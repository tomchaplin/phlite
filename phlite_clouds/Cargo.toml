[package]
name = "phlite_clouds"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology of point clouds and distance matrices (Vietoris–Rips, alpha, ...) with phlite, and the phlite.clouds Python package"
# axiolid-tetrahedralize (3D Delaunay triangulations, for alpha complexes) needs Rust 1.99
rust-version = "1.99"

[lib]
# cdylib for the `phlite.clouds` extension module (feature `python`), rlib for Rust users
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phlite_clouds_rips"
path = "src/bin/rips.rs"

[[bin]]
name = "phlite_clouds_stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["python"]

[dependencies]
csv = "1.4.0"
ordered-float = "5.5.1"
phlite = { version = "0.1.0", path = "../phlite", features = ["parallel"] }
phlite_complexes = { path = "../phlite_complexes" }
rayon = "1.12.0"
# Delaunay triangulations for alpha complexes: in the plane, and in space (exact predicates with symbolic
# perturbation; MPL-2.0)
spade = "2.15.1"
axiolid-tetrahedralize = "0.1.2"
glam = "0.29"
# Exact in-sphere tests, when floating point can't decide
num-bigint = "0.4.8"
num-traits = "0.2.19"
# Exact orientation tests, for points spanning fewer dimensions than they have coordinates
robust = "1.2.0"
pyo3 = { version = "0.30.1", optional = true }
pyo3-log = { version = "0.13.5", optional = true }
pyo3-stub-gen = { version = "0.23.2", optional = true }
numpy = { version = "0.30.0", optional = true }
phlite_bindings = { path = "../phlite_bindings", optional = true }

[features]
# Also build the lock-free backend of the parallel reduction (tests and benchmarks use it when enabled)
lock-free = ["phlite/lock-free", "phlite_complexes/lock-free"]
# The `phlite.clouds` Python extension module, built with maturin as `phlite-clouds` (see pyproject.toml)
python = ["dep:pyo3", "dep:pyo3-log", "dep:pyo3-stub-gen", "dep:numpy", "dep:phlite_bindings", "lock-free"]

[dev-dependencies]
# Tom's alpha filtration in the plane, to check ours against
alphalpha = { version = "0.1.0", default-features = false }
criterion = "0.8.2"
rustc-hash = "2.1.3"

[[bench]]
name = "reduction"
harness = false
