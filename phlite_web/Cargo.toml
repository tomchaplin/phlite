[package]
name = "phlite_web"
version = "0.1.0"
edition = "2021"
description = "phlite compiled to WebAssembly (with threads) for the browser playground"
license = "MIT"
publish = false

# Built on its own (not part of the main workspace): it needs a nightly toolchain, the wasm32 target and a rebuilt
# standard library with atomics, see rust-toolchain.toml, .cargo/config.toml and README.md
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phlite = { path = "../phlite", features = ["parallel", "lock-free"] }
phlite_rips = { path = "../phlite_rips", features = ["lock-free"] }
phlite_grpph = { path = "../phlite_grpph" }
phlite_py = { path = "../phlite_py", features = ["lock-free"] }
ordered-float = "5.5.1"
# The alpha filtration of points in the plane (Delaunay triangulation by spade)
alphalpha = { version = "0.1.0", default-features = false }
spade = "2.2.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.130"
wasm-bindgen-rayon = "1.3.0"
console_error_panic_hook = "0.1.7"
# dashmap's locks park threads with parking_lot_core, whose WebAssembly parker (on atomics) is behind `nightly`
parking_lot_core = { version = "0.9.12", features = ["nightly"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
