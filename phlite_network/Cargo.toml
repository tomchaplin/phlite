[package]
name = "phlite_network"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology of networks (grounded persistent path homology of weighted digraphs, ...), implemented with phlite"
# The Python bindings are the `phlite.network` submodule of the `phlite` package, in phlite_py/src/python/network

[[bin]]
name = "phlite_network_grpph"
path = "src/bin/grpph.rs"

[dependencies]
log = "0.4.35"
ordered-float = "5.5.1"
petgraph = "0.8.3"
phlite = { version = "0.1.0", default-features = false, path = "../phlite", features = ["parallel"] }
rustc-hash = "2.1.3"

[features]
default = ["lock-free"]
# The lock-free backend of the parallel reduction
lock-free = ["phlite/lock-free"]

[dev-dependencies]
criterion = "0.8.2"
rayon = "1.12.0"

[[bench]]
name = "reduction"
harness = false
