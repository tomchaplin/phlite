[project]
name = "phlite-python-tests"
version = "0.0.0"
description = "Fuzz tests and benchmarks for phlite's Python bindings against reference implementations"
# giotto-ph has no wheels after 3.12 and grpphati pins numpy<1.25 (no wheels after 3.11)
requires-python = "==3.11.*"
dependencies = [
    "maturin>=1.9,<2.0",
    "pytest>=8",
    "hypothesis>=6.100",
    "numpy",
    "networkx",
    "ripser",
    "giotto-ph",
    "grpphati",
    # For phlite.clouds (alpha, Čech, ...) and phlite.images (cubical)
    "gudhi",
    # For phlite.networks (directed flag complexes)
    "pyflagser",
    # For phlite.images (cubical)
    "cripser",
    # For phlite.networks.pph in every dimension: PathHomFast (WeilabMSU/PathHom, MIT, pure Python), persistent path
    # homology from explicit filtered bases of Omega. Not on PyPI, so pinned to a commit
    "pathhomfast @ git+https://github.com/WeilabMSU/PathHom@0184cfa8b5f2fd44d4132853871467a9d6d08e4d",
    "pytest-timeout>=2.3",
]

[tool.uv]
# phlite is built into this environment by `maturin develop` (see justfile)
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The benchmarks in benchmarks/ are collected only when asked for (see the justfile)
python_files = ["test_*.py", "bench_*.py"]
markers = [
    "quick: the benchmark cases that `just bench-check` compares with the saved baseline",
    "large: the slowest benchmark cases, timed once each",
]

[dependency-groups]
dev = [
    "memray>=1.20.0",
    "pytest-benchmark>=5.3.1",
    "tadasets>=0.2.2",
]
docs = [
    "altair>=5.4",
    "marimo>=0.9",
    "polars>=1.0",
    "vl-convert-python>=1.6",
]
