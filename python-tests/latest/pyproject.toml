[project]
name = "phlite-python-tests-latest"
version = "0.0.0"
description = "The newer environment of phlite's python-tests: phlite's explicit complexes against PHAT and LoPHAT"
# LoPHAT 0.14 needs Python >= 3.12, while the main python-tests environment is stuck on 3.11 (see ../pyproject.toml)
requires-python = ">=3.12"
dependencies = [
    "maturin>=1.9,<2.0",
    "pytest>=8",
    "hypothesis>=6.100",
    "numpy",
    # PHAT is installed separately by `just install-phat`, since its PyPI metadata is broken
    "lophat>=0.14",
    # For phlite_complexes' own tests
    "networkx",
    "scipy",
    # Perseus 6 (Vidit Nanda; MIT): Rips, cubical, flag and simplicial persistence, a reference since 2026-11-21.
    # PyPI's perseus-tda 6.0.0 predates its current engines, so pinned to a commit and built from source (C++17)
    "perseus-tda @ git+https://github.com/viditnanda/perseus@cbd001763d094d0cf1a44fd4ed593c4a4c3592da#subdirectory=python",
    "pytest-timeout>=2.3",
]

[tool.uv]
# phlite is built into this environment by `maturin develop` (see ../justfile)
package = false

[dependency-groups]
dev = [
    "memray>=1.20.0",
    "pytest-benchmark>=5.3.1",
    "tadasets>=0.2.2",
]
docs = [
    "altair>=5.4",
    "furo>=2024.8",
    "marimo>=0.9",
    "myst-parser>=4",
    "polars>=1.0",
    "sphinx>=8",
    "sphinx-autoapi>=3.3",
    "vl-convert-python>=1.6",
]
