[package]
name = "phlite_bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The shared Python bindings of phlite: choosing an algorithm, building barcodes, and the phlite.core module"
repository.workspace = true
homepage = "https://phlite.tomchaplin.xyz"
documentation = "https://docs.rs/phlite_bindings"
readme = "README.md"
keywords = ["topology", "persistence", "homology", "python"]
categories = ["mathematics", "science"]

[lib]
# cdylib for the `phlite.core` extension module (feature `extension`), rlib for the other packages' bindings
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phlite_bindings_stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["stub-gen"]

[dependencies]
ordered-float = "5.5.1"
phlite = { workspace = true, features = ["parallel", "lock-free"] }
pyo3 = "0.30.1"
# Without its default `infer_signature`, which the stubs need (the `stub-gen` feature) but which doesn't compile for
# PyPy, which the release builds wheels for
pyo3-stub-gen = { version = "0.23.2", default-features = false, features = ["either", "numpy", "ordered-float"] }
rayon = "1.12.0"

[features]
# The `phlite.core` extension module itself (the classes `Algorithm` and `Barcode`, and the registry of pipelines),
# built by maturin as the `phlite-core` package (see pyproject.toml). The other packages leave this off: they reach
# those classes through Python.
extension = []
# Generating the type stubs (`just stubs`): default values in signatures need pyo3-stub-gen's `infer_signature`
stub-gen = ["extension", "pyo3-stub-gen/infer_signature"]
