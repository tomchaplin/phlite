[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "phlite-core"
readme = "README.md"
description = "The shared core of phlite's Python packages: choosing an algorithm, and barcodes"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://phlite.tomchaplin.xyz"
Documentation = "https://phlite.tomchaplin.xyz/book/"
Repository = "https://github.com/tomchaplin/phlite"

[tool.maturin]
features = ["extension", "pyo3/extension-module"]
# `phlite` is a namespace package shared by every phlite package, so python/phlite has no __init__.py: only this
# package's own module, phlite/core, which re-exports the extension module `phlite.core._core` (with its stubs)
python-source = "python"
module-name = "phlite.core._core"
# Bytecode left by local runs (from python-source) doesn't belong in the wheel
exclude = ["**/__pycache__/**"]
