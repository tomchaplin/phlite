[package]
name = "phlite_cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology of point clouds and distance matrices (Vietoris–Rips, ...), implemented with phlite"
# The Python bindings are the `phlite.cloud` submodule of the `phlite` package, in phlite_py/src/python/cloud

[[bin]]
name = "phlite_cloud_rips"
path = "src/bin/rips.rs"

[dependencies]
csv = "1.4.0"
ordered-float = "5.5.1"
phlite = { version = "0.1.0", path = "../phlite", features = ["parallel"] }
rayon = "1.12.0"

[features]
# Also build the lock-free backend of the parallel reduction (tests and benchmarks use it when enabled)
lock-free = ["phlite/lock-free"]

[dev-dependencies]
criterion = "0.8.2"
rustc-hash = "2.1.3"

[[bench]]
name = "reduction"
harness = false
