[package]
name = "phlite_image"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology of images (cubical complexes), implemented with phlite"
# The Python bindings are the `phlite.image` submodule of the `phlite` package, in phlite_py/src/python/image

[dependencies]
ordered-float = "5.5.1"
phlite = { version = "0.1.0", path = "../phlite", features = ["parallel"] }

[features]
# Also build the lock-free backend of the parallel reduction
lock-free = ["phlite/lock-free"]
