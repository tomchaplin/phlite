[package]
name = "phlite_complexes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology of explicit sparse filtered chain complexes with phlite, and the phlite.complexes Python package"
repository.workspace = true
homepage = "https://phlite.tomchaplin.xyz"
documentation = "https://docs.rs/phlite_complexes"
readme = "README.md"
keywords = ["topology", "persistence", "homology", "chain-complex"]
categories = ["mathematics", "science"]

[lib]
# cdylib for the `phlite.complexes` extension module (feature `python`), rlib for Rust users and tests (and phlite_web)
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phlite_complexes_stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["stub-gen"]

[dependencies]
ordered-float = "5.5.1"
phlite = { workspace = true, features = ["parallel"] }
pyo3 = { version = "0.30.1", optional = true }
pyo3-log = { version = "0.13.5", optional = true }
# Without its default `infer_signature`, which the stubs need (the `stub-gen` feature) but which doesn't compile for
# PyPy, which the release builds wheels for
pyo3-stub-gen = { version = "0.23.2", optional = true, default-features = false, features = ["either", "numpy", "ordered-float"] }
numpy = { version = "0.30.0", optional = true }
phlite_bindings = { workspace = true, optional = true }

[features]
# Also build the lock-free backend of the parallel reduction
lock-free = ["phlite/lock-free"]
# The `phlite.complexes` Python extension module, built with maturin as `phlite-complexes` (see pyproject.toml)
python = ["dep:pyo3", "dep:pyo3-log", "dep:pyo3-stub-gen", "dep:numpy", "dep:phlite_bindings", "lock-free"]
# Generating the type stubs (`just stubs`): default values in signatures need pyo3-stub-gen's `infer_signature`
stub-gen = ["python", "pyo3-stub-gen/infer_signature"]

[dev-dependencies]
proptest = "1.12.0"
