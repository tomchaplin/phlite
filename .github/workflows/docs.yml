# Build the documentation site (the landing page, the book, the Python API reference, the example notebooks, which are
# re-run, and the playground: phlite compiled to WebAssembly with a Svelte app) and deploy it to Netlify.
#
# * Pull requests: build only, so that a change that breaks a notebook or the book is caught (the site is kept as an
#   artifact to look at).
# * Pushes to the `release` branch: build and deploy to production (https://phlite.tomchaplin.xyz).
# * Manual runs, the button to publish the docs from GitHub (Actions > Docs > Run workflow, choosing a branch, main by
#   default): build and deploy that branch, then fast-forward `release` to the commit deployed, so that `release`
#   always says what is published. It checks first that this is a fast-forward, and stops (deploying nothing) if
#   `release` has commits the branch doesn't.
#
# So the site follows `release`, not `main`: pushing work to main doesn't change the published docs, and the docs can
# be updated without releasing a new version. Publish with the button, or from a clone with `just publish-docs`
# (`git push origin main:release`, which deploys through the push trigger). When releasing a version, do this too.
#
# Deploying needs two repository secrets (Settings > Secrets and variables > Actions):
# * NETLIFY_AUTH_TOKEN: a personal access token (Netlify: User settings > Applications > Personal access tokens);
# * NETLIFY_SITE_ID: the site's ID (Netlify: Site configuration > General > Site details).
# The Netlify site itself does no building: its builds should be stopped (Site configuration > Build & deploy).
# docs/landing/_headers (copied to the site's root) makes the playground cross-origin isolated, which its threads need.

name: Docs

on:
  push:
    branches: [release]
  pull_request:
  workflow_dispatch:

permissions:
  # Write, for manual runs to move `release` (pushes with this token don't trigger workflows, so that deploys nothing
  # twice); every other step only reads
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The history, for the fast-forward check of manual runs
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}

      - name: Check that release can be fast-forwarded to this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --heads origin release > /dev/null; then
            git fetch origin release
            if ! git merge-base --is-ancestor origin/release HEAD; then
              echo "::error::release has commits that ${{ github.ref_name }} doesn't: merge them into it first, or move release by hand"
              exit 1
            fi
          fi

      - uses: dtolnay/rust-toolchain@stable

      # The release builds of the Python packages and of the WebAssembly are most of the time; cache them
      # (phlite_web is outside the workspace, with its own target directory and nightly toolchain)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            phlite_web -> target

      - name: Install the playground's nightly toolchain (phlite_web/rust-toolchain.toml)
        run: cd phlite_web && rustup toolchain install

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phlite_web/app/package-lock.json

      # uv also fetches the two Pythons python-tests needs (3.11 and 3.13)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "python-tests/**/uv.lock"

      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook@0.5.4,wasm-bindgen@0.2.130

      - name: Build the Python packages
        run: just docs-modules

      - name: Build the site (figures, book, API reference, notebooks, playground)
        run: just docs

      - name: Type-check the playground
        run: just phlite_web/check

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/site
          retention-days: 7

      - name: Deploy to Netlify
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir docs/site --prod --message "${{ github.sha }}"

      - name: Move release to the commit deployed (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: git push origin "HEAD:refs/heads/release"
