# Build every phlite Python package and publish them to PyPI, on a tag `vX.Y.Z`:
# * a wheel per package (`package` in each matrix: the crate it is built from, phlite_bindings being `phlite-core`) and
#   platform, plus an sdist per package;
# * the metapackage `phlite` (phlite_meta: no files, it only depends on the others).
# Every crate and package share one version (`[workspace.package] version` in Cargo.toml, and phlite_meta's pins): bump
# it, then tag. (Generated by maturin v1.6.0, `maturin generate-ci github`, then adapted.)
#
# The Linux x86_64 wheels are built with profile-guided optimisation: `pgo-profile` builds every package instrumented
# and runs python-tests/pgo_train.py (`just pgo-profile`), and those wheels are built with the merged profile, by the
# same Rust version (a profile is only read by the LLVM that wrote it). About 4% faster overall in our benchmarks, and
# 15-20% on GrPPH and PPH. Run the workflow by hand (workflow_dispatch) to build everything without publishing.

name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgo-profile:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Rust version (the wheels using the profile are built with the same)
        id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build instrumented wheels, run the training workload, merge the profiles
        run: just pgo-profile
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-profile
          path: pgo/merged.profdata

  linux:
    needs: pgo-profile
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Download the PGO profile (x86_64)
        if: matrix.platform.target == 'x86_64'
        uses: actions/download-artifact@v4
        with:
          name: pgo-profile
          path: pgo
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # maturin-action passes RUST* variables into its manylinux container, which mounts the workspace at the same path
          RUSTFLAGS: ${{ matrix.platform.target == 'x86_64' && format('-Cprofile-use={0}/pgo/merged.profdata', github.workspace) || '' }}
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ matrix.platform.target == 'x86_64' && needs.pgo-profile.outputs.rust || '' }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-linux-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: musllinux_1_2
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-musllinux-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-windows-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        platform:
          - runner: macos-13
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-macos-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  sdist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ matrix.package }}
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-sdist
          path: ${{ matrix.package }}/dist

  metapackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the metapackage `phlite`
        run: uv build --out-dir dist phlite_meta
      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: wheels-phlite-meta
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, musllinux, windows, macos, sdist, metapackage]
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
