# Build every phlite Python package and publish them to PyPI, and publish every crate to crates.io, on a tag `vX.Y.Z`:
# * a wheel per package (`package` in each matrix: the crate it is built from, phlite_bindings being `phlite-core`) and
#   platform, plus an sdist per package;
# * the metapackage `phlite` (phlite_meta: no files, it only depends on the others);
# * the crates (`cargo publish --workspace`: phlite, then phlite_bindings and phlite_complexes, then phlite_clouds and
#   phlite_images, then phlite_networks), once every wheel has built.
#
# Publishing to PyPI is by trusted publishing: each of the six projects (phlite, phlite-core, phlite-complexes,
# phlite-clouds, phlite-networks, phlite-images) has this repository's `release.yml`, in the environment `pypi`, as a
# trusted publisher (on the project's Manage > Publishing page). PyPI allows only one *pending* publisher (for a project
# not yet created) per repository, workflow and environment (pypi/warehouse#20006), so the first release, which creates
# the six projects, uses an account-wide API token instead: while the secret PYPI_API_TOKEN exists, it is used; delete
# it once every project has its trusted publisher, and trusted publishing takes over. Publishing to crates.io needs the repository secret CARGO_REGISTRY_TOKEN (crates.io > Account
# Settings > API Tokens, with the publish-new and publish-update scopes). A run by hand builds everything and dry-runs
# the crates' publication, publishing nothing.
# Every crate and package share one version (`[workspace.package] version` in Cargo.toml, and phlite_meta's pins): bump
# it, then tag. (Generated by maturin v1.6.0, `maturin generate-ci github`, then adapted.)
#
# The Linux x86_64 wheels are built with profile-guided optimisation: `pgo-profile` builds every package instrumented
# and runs python-tests/pgo_train.py (`just pgo-profile`), and those wheels are built with the merged profile, by the
# same Rust version (a profile is only read by the LLVM that wrote it). About 4% faster overall in our benchmarks, and
# 15-20% on GrPPH and PPH. Run the workflow by hand (workflow_dispatch) to build everything without publishing.

name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgo-profile:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - name: Rust version (the wheels using the profile are built with the same)
        id: rust
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Build instrumented wheels, run the training workload, merge the profiles
        run: just pgo-profile
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-profile
          path: pgo/merged.profdata

  linux:
    needs: pgo-profile
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Download the PGO profile (x86_64)
        if: matrix.platform.target == 'x86_64'
        uses: actions/download-artifact@v4
        with:
          name: pgo-profile
          path: pgo
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # maturin-action passes RUST* variables into its manylinux container, which mounts the workspace at the same path
          RUSTFLAGS: ${{ matrix.platform.target == 'x86_64' && format('-Cprofile-use={0}/pgo/merged.profdata', github.workspace) || '' }}
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ matrix.platform.target == 'x86_64' && needs.pgo-profile.outputs.rust || 'stable' }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-linux-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # The runners' preinstalled Rust can be too old (phlite_clouds needs 1.99), so ask for the latest
          rust-toolchain: stable
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: musllinux_1_2
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-musllinux-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # The runners' preinstalled Rust can be too old (phlite_clouds needs 1.99), so ask for the latest
          rust-toolchain: stable
          args: --release --out dist --find-interpreter
          sccache: 'true'
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-windows-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
        # GitHub retires macOS images (macos-13 and macos-14 are gone): macos-15-intel is its last Intel image, after
        # which Intel wheels would have to be cross-compiled on Apple silicon (target x86_64 on macos-latest)
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # The runners' preinstalled Rust can be too old (phlite_clouds needs 1.99), so ask for the latest
          rust-toolchain: stable
          args: --release --out dist --find-interpreter
          sccache: 'true'
          working-directory: ${{ matrix.package }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-macos-${{ matrix.platform.target }}
          path: ${{ matrix.package }}/dist

  sdist:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [phlite_bindings, phlite_complexes, phlite_clouds, phlite_networks, phlite_images]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ matrix.package }}
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}-sdist
          path: ${{ matrix.package }}/dist

  metapackage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the metapackage `phlite`
        run: uv build --out-dir dist phlite_meta
      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: wheels-phlite-meta
          path: dist

  crates:
    name: Crates
    runs-on: ubuntu-latest
    needs: [linux, musllinux, windows, macos, sdist, metapackage]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Packages and builds every crate against the others as they will be published (not as on crates.io now), in
      # dependency order, without uploading
      - name: Check the crates can be published
        run: cargo publish --workspace --dry-run
      # Each crate waits for the ones it depends on to reach the index. If one fails part way (a crate's version is
      # already on crates.io, say), publish the rest by hand: `cargo publish -p <crate>`, in the order above.
      - name: Publish to crates.io
        if: "startsWith(github.ref, 'refs/tags/')"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, musllinux, windows, macos, sdist, metapackage]
    # PyPI's trusted publishing: each project trusts this workflow, in this environment, so no token is stored. The job
    # asks GitHub for an OIDC token (id-token), which PyPI exchanges for a short-lived upload token.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Collect every wheel and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          # Empty (the secret deleted): trusted publishing. Set: that token (for the first release, see above)
          password: ${{ secrets.PYPI_API_TOKEN }}
