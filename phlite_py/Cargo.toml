[package]
name = "phlite_py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for phlite: persistent homology of explicit sparse filtered chain complexes"
publish = false

[lib]
# The Python module is called `phlite` (see `#[pymodule(name = "phlite")]` and pyproject.toml),
# but the crate can't be, since it depends on the `phlite` crate
name = "phlite_py"
path = "src/lib.rs"
# cdylib for the Python extension module (feature `python`), rlib for Rust tests
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phlite_py_stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["python"]

[dependencies]
ordered-float = "5.5.1"
phlite = { version = "0.1.0", path = "../phlite", features = ["parallel"] }
pyo3 = { version = "0.30.1", optional = true }
pyo3-log = { version = "0.13.5", optional = true }
pyo3-stub-gen = { version = "0.23.2", optional = true }
phlite_pyutils = { path = "../phlite_pyutils", default-features = false, optional = true }
numpy = { version = "0.30.0", optional = true }

[features]
# Also build the lock-free backend of the parallel reduction
lock-free = ["phlite/lock-free", "phlite_pyutils?/lock-free"]
# The `phlite` Python extension module, built with maturin (see pyproject.toml)
python = ["dep:pyo3", "dep:pyo3-log", "dep:pyo3-stub-gen", "dep:phlite_pyutils", "dep:numpy", "lock-free"]

[dev-dependencies]
proptest = "1.12.0"
