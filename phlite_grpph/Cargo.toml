[package]
name = "phlite_grpph"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "phlite_grpph"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "phlite_grpph_cli"
path = "src/bin/main.rs"

[[bin]]
name = "phlite_grpph_stub_gen"
path = "src/bin/stub_gen.rs"
doc = false
required-features = ["python"]

[dependencies]
log = "0.4.35"
ordered-float = "5.5.1"
petgraph = "0.8.3"
phlite = { version = "0.1.0", default-features = false, path = "../phlite", features = ["parallel"] }
rustc-hash = "2.1.3"
pyo3 = { version = "0.30.1", optional = true }
pyo3-log = { version = "0.13.5", optional = true }
pyo3-stub-gen = { version = "0.23.2", optional = true }
phlite_pyutils = { path = "../phlite_pyutils", default-features = false, optional = true }

[features]
default = ["lock-free"]
# The lock-free backend of the parallel reduction (the 'parallel-lock-free' algorithm in Python)
lock-free = ["phlite/lock-free", "phlite_pyutils?/lock-free"]
# The `phlite_grpph` Python module (maturin builds with this feature, see pyproject.toml)
python = ["dep:pyo3", "dep:pyo3-log", "dep:pyo3-stub-gen", "dep:phlite_pyutils", "lock-free"]


[dev-dependencies]
criterion = "0.8.2"
rayon = "1.12.0"

[[bench]]
name = "reduction"
harness = false
