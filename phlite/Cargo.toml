[package]
name = "phlite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent homology, for generic matrices, that's light on memory usage"
repository.workspace = true
homepage = "https://phlite.tomchaplin.xyz"
documentation = "https://docs.rs/phlite"
readme = "README.md"
keywords=["topology", "persistence", "homology", "matrix", "linalg"]
categories=["mathematics"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
dary_heap = "0.3.9"
itertools = "0.15.0"
num = "0.4.3"
ordered-float = "5.5.1"
rustc-hash = "2.1.3"
rayon = { version = "1.12.0", optional = true }
dashmap = "6.2.1"
papaya = { version = "0.2.5", optional = true }
arc-swap = { version = "1.9.5", optional = true }
scc = { version = "3.8.8", optional = true }
delegate = "0.13.5"
auto_impl = "1.4.0"

[features]
# Parallel reduction algorithms (see `reduction::parallel`)
parallel = ["dep:rayon"]
# Lock-free storage backend for the parallel reduction (see `reduction::parallel`)
lock-free = ["parallel", "dep:papaya", "dep:arc-swap"]
# Every concurrent pivot table and slot for the parallel reduction, to benchmark them (`parallel::experiments`, unstable)
storage-experiments = ["lock-free", "dep:scc"]

[dev-dependencies]
proptest = "1.12.0"

